<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5a45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>İlim Takip</title>
<style>
:root{--bg:#f3efe4;--card:#fffdf7;--g:#1f5a45;--g2:#e1eee4;--gold:#b98a2e;--ink:#1f2a25;--mute:#667168;--line:#e0dacb;--gt:#fff;--red:#b0463d;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);padding:env(safe-area-inset-top) 0 96px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.w{max-width:1240px;margin:auto;padding:14px 16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.logo{display:flex;gap:11px;align-items:center}.logo i{font:700 26px var(--serif);font-style:normal;width:42px;height:42px;border-radius:13px;background:var(--g);color:var(--gt);display:grid;place-items:center}
.logo b{font:700 26px/1 var(--serif);display:block}.logo span{font-size:13px;color:var(--mute)}
.pill{font-weight:700;font-size:14px;color:var(--g);background:var(--g2);padding:8px 15px;border-radius:99px}
.wk{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.dh{font:700 15px var(--serif);text-align:center;padding:8px 0;border-radius:12px;background:var(--g2);color:var(--g)}.dh.on{background:var(--g);color:var(--gt)}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px}
.c.td{border:2px solid var(--gold)}.c.big{margin-bottom:12px}
.t{font:700 19px/1.15 var(--serif);cursor:pointer}
h2{margin:0 0 8px;font:700 21px var(--serif);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:7px;border-radius:7px;background:var(--g2);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:7px}
.m{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.o{display:flex;gap:8px;align-items:flex-start;font-size:13px;border-top:1px solid var(--line);padding-top:7px;line-height:1.3}
.o input{margin:1px 0 0;accent-color:var(--g);width:18px;height:18px;flex:none}.o span{flex:1;cursor:pointer}.o.d span{color:var(--mute);text-decoration:line-through}
.g{align-self:flex-start;font:700 11px var(--sans);padding:2px 9px;border-radius:99px;background:#f6e7c3;color:#6f4d0e}.g.r{background:#f5d9d5;color:#8a2d25}
.cr{display:flex;gap:8px;flex-wrap:wrap}.cr button{border:0;background:none;color:var(--g);font-size:12px;font-weight:700;padding:3px 0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.row .x{flex:1;min-width:0}.row b{display:block}
.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--g);color:var(--gt);font-weight:700}.btn.s{background:var(--g2);color:var(--g)}.btn.o2{background:none;border:1px solid var(--line);color:var(--ink)}.btn.d{background:none;border:1px solid var(--line);color:var(--red)}.btn.xs{padding:6px 11px;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--g2);color:var(--g)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.seg{display:flex;background:var(--g2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--g)}.seg button.on{background:var(--card);box-shadow:0 2px 8px #0002}
.timer{font:700 64px/1 var(--serif);text-align:center;margin:14px 0;font-variant-numeric:tabular-nums}.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}textarea{min-height:90px}
.chart{display:flex;gap:4px;align-items:flex-end;height:130px;margin:6px 0}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute);min-width:0}.chart i{display:block;width:100%;background:var(--g);border-radius:6px 6px 2px 2px;min-height:2px;margin-bottom:3px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}.st .c{text-align:center;margin:0}.st b{font:700 26px var(--serif);color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:6px 90px calc(6px + env(safe-area-inset-bottom)) 6px;z-index:5}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mute);font-size:12px;font-weight:700;padding:7px 2px;border-radius:12px;min-height:48px}nav button b{display:block;font-size:19px;line-height:1.2}nav button.on{background:var(--g2);color:var(--g)}
#fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);color:#fff;font:700 36px/1 var(--sans);box-shadow:0 8px 20px #0004;z-index:6}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.open{display:flex}
#f{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qk .btn{padding:18px 10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;display:none;z-index:20}
.empty{color:var(--mute);text-align:center;padding:12px;font-size:13px}.mute{color:var(--mute)}.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.wd{font:700 42px/1.1 var(--serif);text-align:center;margin:18px 0 8px;overflow-wrap:anywhere}
.wm{background:var(--g2);border-radius:14px;padding:12px 14px;margin:12px 0}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rt .btn{padding:15px 4px}.btn.rd{background:var(--red);color:var(--gt)}
.seg.sm button{font-size:12px;padding:9px 2px}.bigb{width:100%;padding:16px}
</style>
</head>
<body>
<div class="w"><main id="app"></main></div>
<nav id="nav"></nav><button id="fab" aria-label="Hızlı ekle" data-a="quick">+</button>
<div id="sh"><form id="f"></form></div><div id="toast"></div><input type="file" id="fi" accept=".json,application/json" hidden>
<script>
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],SH=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'],KEY='ilim-takip-v5',STEPS=[1,3,7,14,30,60];
const PAL={Zeytin:[['#f3efe4','#fffdf7','#1f5a45','#e1eee4','#b98a2e'],['#111a16','#1a2620','#7cc2a0','#223a2e','#e0b55f']],Lacivert:[['#eef1f6','#fff','#25477a','#dfe7f4','#b8862b'],['#0f1520','#18212f','#8fb3ec','#23324a','#e0b55f']],Bordo:[['#f6eeee','#fffafa','#7d2a35','#f3dfe1','#b08a3a'],['#1c1214','#2a1b1e','#e39aa5','#43252b','#e0b55f']],Mor:[['#f2eff7','#fdfcff','#5b3f8f','#e7e0f3','#b8862b'],['#15111d','#211b2c','#b9a1ea','#352a4d','#e0b55f']],Kahve:[['#f4ede4','#fffaf3','#6b4a2e','#eadfce','#2f6b5a'],['#1a1411','#261e19','#d3a679','#3d2f24','#7cc2a0']]};
const pad=n=>String(n).padStart(2,'0'),iso=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dt=s=>new Date(s+'T12:00:00'),addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)},dow=s=>dt(s).getDay(),wStart=s=>addD(s,-((dow(s)+6)%7));
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),hm=m=>m>=60?Math.floor(m/60)+' sa'+(m%60?' '+m%60+' dk':''):m+' dk';
const dl=(s,o)=>dt(s).toLocaleDateString('tr-TR',o);
/* ---- depolama: IndexedDB + localStorage + günlük anlık yedek ---- */
let _db;const DB={o(){return _db||(_db=new Promise((r,j)=>{const q=indexedDB.open('ilim',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=j}))},
get(k){return this.o().then(db=>new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}))},
set(k,v){return this.o().then(db=>new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()}))}};
let D,SN=[],PER=false,st;
function seed(){const C=[],S=[],c=(n,g,days)=>{const id=uid();C.push({id,name:n,goal:g,prog:0,label:'',exam:''});days.forEach(d=>S.push({id:uid(),day:d,cid:id}))};
c('İsagoci',180,[1,3,4]);c('Bilim Felsefesi',120,[1]);c('Vaz‘ İlmi',120,[1,4]);c('Münazara',120,[2,4]);c('Şerhu Suğra',180,[2,3,5]);c('Okuma ve tekrar',120,[6]);
return{courses:C,slots:S,hw:[],topics:[],sessions:[],notes:[],books:[],pal:'Zeytin',mode:'auto',backup:0,snapDay:'',words:[],wcats:DEFC.slice()}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}clearTimeout(st);st=setTimeout(async()=>{try{await DB.set('data',D);if(D.snapDay!==iso()){D.snapDay=iso();SN.unshift({t:Date.now(),d:JSON.stringify(D)});SN=SN.slice(0,7);await DB.set('snaps',SN);await DB.set('data',D)}}catch(e){}},300)};
/* ---- tema ---- */
function theme(){const dark=D.mode==='dark'||(D.mode!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches),c=(PAL[D.pal]||PAL.Zeytin)[dark?1:0],s=document.documentElement.style;
['bg','card','g','g2','gold'].forEach((k,i)=>s.setProperty('--'+k,c[i]));s.setProperty('--ink',dark?'#ece8da':'#1f2a25');s.setProperty('--mute',dark?'#9aa59d':'#667168');s.setProperty('--line',dark?'#31403a':'#e0dacb');s.setProperty('--gt',dark?'#10151a':'#fff');s.setProperty('--red',dark?'#e88c84':'#b0463d');
const m=document.querySelector('meta[name=theme-color]');if(m)m.content=c[0]}
/* ---- veri yardımcıları ---- */
let V='prog',SEG='notes',NF='',RP='Hafta',RO=0,T={run:false,start:0,acc:0,cid:''};
try{const x=JSON.parse(localStorage.getItem(KEY+'-t'));if(x)T=x}catch(e){}
const saveT=()=>{try{localStorage.setItem(KEY+'-t',JSON.stringify(T))}catch(e){}};
const C=id=>D.courses.find(c=>c.id===id)||{name:'(silinmiş ders)',goal:0,prog:0},elapsed=()=>T.acc+(T.run?Date.now()-T.start:0),fmt=ms=>{const s=Math.floor(ms/1e3);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const inR=(d,a,b)=>d>=a&&d<=b,wmin=cid=>{const a=wStart(iso()),b=addD(a,6);return D.sessions.filter(s=>s.cid===cid&&inR(s.date,a,b)).reduce((x,s)=>x+s.min,0)};
const left=d=>Math.round((dt(d)-dt(iso()))/864e5),lbl=d=>{const n=left(d);return n<0?'Geçti':n===0?'Bugün':n+' gün'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)};
const opt=(a,v)=>a.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('');
/* ---- görünümler ---- */
function card(s,d){const c=C(s.cid),n=D.notes.filter(x=>x.cid===c.id).length,hw=D.hw.filter(h=>h.sid===s.id);
return`<div class="c ${d===dow(iso())?'td':''}"><div class="t" data-a="ec" data-id="${c.id}">${esc(c.name)}</div>${c.exam?`<span class="g ${left(c.exam)<0?'r':''}">Sınav · ${lbl(c.exam)}</span>`:''}<div class="bar"><i style="width:${c.prog||0}%"></i></div><div class="m"><span>%${c.prog||0}${c.label?' · '+esc(c.label):''}</span><span>${hm(wmin(c.id))} / ${hm(c.goal||0)}</span></div>
${hw.map(h=>`<div class="o ${h.done?'d':''}"><input type="checkbox" data-a="th" data-id="${h.id}" ${h.done?'checked':''} aria-label="Tamamlandı"><span data-a="eh" data-id="${h.id}">${esc(h.text)}${h.due&&!h.done?` <b class="g ${left(h.due)<0?'r':''}">${lbl(h.due)}</b>`:''}</span></div>`).join('')}
<div class="cr"><button data-a="ah" data-id="${s.id}">＋ ödev</button><button data-a="rec" data-id="${c.id}">◷ süre</button>${n?`<button data-a="nn" data-id="${c.id}">✎ ${n} not</button>`:''}</div></div>`}
function vProg(){const t=iso(),days=[1,2,3,4,5,6].concat(D.slots.some(s=>s.day===0)?[0]:[]),wm=D.sessions.filter(s=>inR(s.date,wStart(t),addD(wStart(t),6))).reduce((a,s)=>a+s.min,0),gl=D.courses.reduce((a,c)=>a+(c.goal||0),0);
const up=[];D.courses.filter(c=>c.exam).forEach(c=>up.push({d:c.exam,x:c.name+' · sınav'}));D.hw.filter(h=>!h.done&&h.due).forEach(h=>up.push({d:h.due,x:h.text+' ('+C((D.slots.find(s=>s.id===h.sid)||{}).cid).name+')'}));up.sort((a,b)=>a.d<b.d?-1:1);
return`<div class="hd"><div class="logo"><i>ع</i><div><b>İlim Takip</b><span>${dl(t,{weekday:'long',day:'numeric',month:'long'})} · bu hafta ${hm(wm)} odak</span></div></div><div style="display:flex;gap:8px;align-items:center"><span class="pill">Hedef %${gl?Math.min(100,Math.round(100*wm/gl)):0}</span><button class="btn s xs" data-a="ac">＋ Ders</button></div></div>
${Date.now()-D.backup>6048e5?`<div class="c big" style="border-color:var(--gold)"><div class="row" style="border:0;padding:0"><span class="x"><b>Yedek zamanı</b><span class="mute sm">Verilerini dosyaya yedekle, tablet silinse de kalsın.</span></span><button class="btn xs" data-a="go" data-v="rep">Yedekle</button></div></div>`:''}
<div class="wk">${days.map(d=>`<div class="col"><div class="dh ${dow(t)===d?'on':''}">${DAYS[d]}${dow(t)===d?' · bugün':''}</div>${D.slots.filter(s=>s.day===d).map(s=>card(s,d)).join('')||'<div class="empty">Ders yok</div>'}</div>`).join('')}</div>
<div class="two"><div class="c"><h2>Araştırılacak konular<button class="btn s xs" data-a="at">＋ Ekle</button></h2>${D.topics.map(x=>`<div class="o ${x.done?'d':''}" style="border-top:1px solid var(--line)"><input type="checkbox" data-a="tt" data-id="${x.id}" ${x.done?'checked':''} aria-label="Tamamlandı"><span data-a="et" data-id="${x.id}">${esc(x.text)}</span></div>`).join('')||'<div class="empty">Araştırmak istediğin konuları buraya yaz.</div>'}</div>
<div class="c"><h2>Yaklaşanlar</h2>${up.slice(0,6).map(u=>`<div class="o"><span style="cursor:default">${esc(u.x)}</span><b class="g ${left(u.d)<0?'r':''}">${lbl(u.d)}</b></div>`).join('')||'<div class="empty">Yaklaşan sınav veya ödev yok.</div>'}</div></div>`}
function vFocus(){const S=D.sessions.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,10);
return`<div class="c big"><h2>Odak sayacı</h2><label>Ders</label><select id="tc">${opt(D.courses.map(c=>[c.id,c.name]),T.cid)}</select><div class="timer" id="td">${fmt(elapsed())}</div><div class="btns"><button class="btn" data-a="tgl">${T.run?'Duraklat':elapsed()?'Devam':'Başlat'}</button><button class="btn s" data-a="tsave">Kaydet</button><button class="btn o2" data-a="treset">Sıfırla</button></div><p class="mute" style="text-align:center;font-size:12px">Uygulamadan çıksan da süre doğru hesaplanır.</p></div>
<div class="c"><h2>Son kayıtlar<button class="btn s xs" data-a="rec">＋ Hızlı kayıt</button></h2>${S.map(s=>`<div class="row"><div class="x"><b>${esc(C(s.cid).name)}</b><span class="mute" style="font-size:12px">${dl(s.date,{day:'numeric',month:'long'})} · ${hm(s.min)}${s.note?' · '+esc(s.note):''}</span></div><button class="btn d xs" data-a="ds" data-id="${s.id}">Sil</button></div>`).join('')||'<div class="empty">Henüz kayıt yok. Başka zaman çalıştığın dersi “Hızlı kayıt” ile ekleyebilirsin.</div>'}</div>`}
function vNotes(){const due=D.notes.filter(n=>n.rev&&n.next<=iso()),L=D.notes.filter(n=>!NF||n.cid===NF);
return`<div class="seg"><button class="${SEG==='notes'?'on':''}" data-a="seg" data-s="notes">Notlar</button><button class="${SEG==='books'?'on':''}" data-a="seg" data-s="books">Kitaplar</button></div>`+(SEG==='notes'?
`<button class="btn" style="width:100%;margin-bottom:12px" data-a="an">＋ Yeni not / mesele</button>${NF?`<div class="c big"><div class="row" style="border:0;padding:0"><span class="x">Filtre: <b style="display:inline">${esc(C(NF).name)}</b></span><button class="btn s xs" data-a="nf">Tümü</button></div></div>`:''}
${due.length?`<div class="c big" style="border-color:var(--gold)"><h2>Tekrar zamanı</h2>${due.map(n=>`<div class="row"><div class="x"><b>${esc(n.title)}</b></div><button class="btn s xs" data-a="rev" data-id="${n.id}">Tekrar ettim</button></div>`).join('')}</div>`:''}
${L.map(n=>`<div class="c big"><h2>${esc(n.title)}</h2><div><span class="chip">${n.cid?esc(C(n.cid).name):'Genel'}</span> ${n.rev?`<span class="g">Tekrar: ${dl(n.next,{day:'numeric',month:'short'})}</span>`:''}</div><div class="mute" style="white-space:pre-wrap">${esc(n.text)}</div><div><button class="btn o2 xs" data-a="en" data-id="${n.id}">Düzenle</button></div></div>`).join('')||'<div class="empty">Henüz not yok. Tekrar planına eklediğin notlar vakti gelince burada görünür.</div>'}`:
`<button class="btn" style="width:100%;margin-bottom:12px" data-a="ab">＋ Kitap ekle</button>${D.books.map(b=>{const p=b.total?Math.min(100,Math.round(100*b.page/b.total)):0;return`<div class="c big"><h2>${esc(b.title)}<small class="mute" style="font:12px var(--sans)">${b.page}/${b.total} sayfa</small></h2><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="border:0;padding:6px 0 0"><span class="x mute">%${p}</span><button class="btn s xs" data-a="pg" data-id="${b.id}">+25 sayfa</button><button class="btn o2 xs" data-a="eb" data-id="${b.id}">Düzenle</button></div></div>`}).join('')||'<div class="empty">Okuduğun kitapları ekle, sayfa ilerlemeni takip et.</div>'}`)}
function vRep(){const t=iso();let bk=[],title,a,b;

rev(e){const n=D.notes.find(x=>x.id===e.dataset.id);n.step=Math.min(STEPS.length-1,(n.step||0)+1);n.next=addD(iso(),STEPS[n.step]);save();render();toast('Sonraki tekrar: '+dl(n.next,{day:'numeric',month:'long'}))},
ab(){sheet('Kitap ekle',bookF,{page:0},o=>D.books.push({id:uid(),title:o.title||'Kitap',total:+o.total||0,page:+o.page||0}))},
eb(e){const b=D.books.find(x=>x.id===e.dataset.id);sheet('Kitabı düzenle',bookF,b,o=>Object.assign(b,{title:o.title,total:+o.total||0,page:+o.page||0}),()=>D.books=D.books.filter(x=>x!==b))},
pg(e){const b=D.books.find(x=>x.id===e.dataset.id);b.page=Math.min(b.total||1e9,b.page+25);save();render()},
pal(e){D.pal=e.dataset.k;theme();save();render()},mode(e){D.mode=e.value;theme();save()},
ks(e){KS=e.dataset.s;WQ=null;WSH=false;render()},show(){WSH=true;render()},rt(e){rate(+e.dataset.r)},
wsave(){const w=$('#nw').value.trim(),m=$('#nm').value.trim();if(!w)return toast('Kelimeyi yaz');
if(D.words.some(x=>nrm(x.w)===nrm(w)&&(nrm(x.m)===nrm(m)||!nrm(m))))return toast('Bu kelime zaten kayıtlı. Farklı anlamı için anlam yaz.');
const dup=D.words.some(x=>nrm(x.w)===nrm(w));D.words.push({id:uid(),w,m,ex:$('#ne').value.trim(),cat:$('#nc').value,added:iso(),s:-1,iv:0,reps:0,lapses:0,next:iso(),last:'',hist:[]});WQ=null;save();render();toast(dup?'Farklı anlam olarak eklendi':'Kelime eklendi');const i=$('#nw');if(i)i.focus()},
ew(e){const w=D.words.find(x=>x.id===e.dataset.id),h=w.hist.slice(-12).reverse().map(x=>dl(x.d,{day:'numeric',month:'short'})+' · '+['Hatırlayamadım','Zor','Kolay'][x.r]).join('<br>');
sheet('Kelimeyi düzenle',[{k:'w',l:'Kelime'},{k:'m',l:'Anlamı'},{k:'ex',l:'Örnek cümle'},{k:'cat',l:'Kategori',t:'sel',o:D.wcats.map(c=>[c,c])}],w,o=>{if(o.w.trim())Object.assign(w,{w:o.w.trim(),m:o.m.trim(),ex:o.ex.trim(),cat:o.cat})},()=>{D.words=D.words.filter(x=>x!==w)},`<p class="mute" style="font-size:13px;margin-bottom:0">${wstat(w)} · ${w.reps} tekrar · ${w.lapses||0} unutma · sonraki: ${dl(w.next,{day:'numeric',month:'long'})}<br>${h||'Henüz tekrar yok.'}</p>`)},
ac2(){sheet('Yeni kategori',[{k:'n',l:'Ad'}],{},o=>{const n=o.n.trim();if(n&&!D.wcats.includes(n))D.wcats.push(n)})},
ec2(e){const i=+e.dataset.i,c=D.wcats[i];sheet('Kategoriyi düzenle',[{k:'n',l:'Ad'}],{n:c},o=>{const n=o.n.trim();if(!n||(n!==c&&D.wcats.includes(n)))return;D.words.forEach(w=>{if(w.cat===c)w.cat=n});D.wcats[i]=n},c==='Diğer'?null:()=>{D.words.forEach(w=>{if(w.cat===c)w.cat='Diğer'});D.wcats.splice(i,1);if(!D.wcats.includes('Diğer'))D.wcats.push('Diğer')})},
bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='ilim-yedek-'+iso()+'.json';a.click();D.backup=Date.now();save();render();toast('Yedek indirildi')},
rs(){$('#fi').click()},
snap(e){if(!confirm('Verilerin bu yedeğe döner. Devam?'))return;const o=JSON.parse(SN[+e.dataset.i].d);mergeW(o);D=o;save();theme();render()},
wipe(){if(confirm('Tüm veriler silinecek. Emin misin?')&&confirm('Bu işlem geri alınamaz. (Otomatik yedekler korunur.)')){D=seed();save();theme();render()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName!=='SELECT'&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('change',e=>{const b=e.target;if(b.tagName==='SELECT'&&b.dataset.a&&A[b.dataset.a])A[b.dataset.a](b)});
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o.courses||!o.slots)throw 0;if(!confirm('Mevcut veriler bu yedekle değişecek. Devam?'))return;mergeW(o);D=o;save();theme();render();toast('Yedek yüklendi')}catch(er){toast('Geçerli bir yedek dosyası seç')}});e.target.value=''};
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f){WF[f]=e.target.value;const l=$('#wl');if(l)l.innerHTML=wlist()}});
setInterval(()=>{const el=$('#td');if(el)el.textContent=fmt(elapsed())},500);
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>D&&theme());
(async()=>{let d;try{d=await DB.get('data')}catch(e){}if(!d)try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=d||seed();fixW(D);try{SN=(await DB.get('snaps'))||[]}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)PER=await navigator.storage.persist()}catch(e){}
theme();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
